name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Run UI tests
        working-directory: ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE_ID"
          xcodebuild test \
            -project ROZLFAI.xcodeproj \
            -scheme ROZLFAI \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO

  build-ipa:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild build \
            -project ROZLFAI.xcodeproj \
            -scheme ROZLFAI \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ROZLFAI-unsigned.ipa Payload
          shasum -a 256 ROZLFAI-unsigned.ipa > ROZLFAI-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ROZLFAI-unsigned-ipa
          path: |
            ios/ROZLFAI-unsigned.ipa
            ios/ROZLFAI-unsigned.ipa.sha256
