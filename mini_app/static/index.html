<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#04070c">
  <meta name="rzlf-api-base" content="">
  <title>ROZLF AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css?v=20261114-premium1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">R</span>
      <div><strong>ROZLF <span>AI</span></strong><small data-i18n="brand.tagline">THE BOT BY LO AND Q8</small></div>
    </div>
    <div class="top-actions">
      <div id="connection-pill" class="signal-pill connecting"><i></i><span data-i18n="state.connecting">CONNECTING</span></div>
      <button id="lang-btn" class="icon-btn" aria-label="Language">ع</button>
      <button class="icon-btn" data-route="settings" aria-label="Settings">⚙</button>
    </div>
  </header>
  <main id="view" class="app-view" aria-live="polite"></main>
  <nav id="tabbar" class="tabbar" aria-label="Primary">
    <div class="tab-shell">
      <button class="tab" data-route="home" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        <span data-i18n="nav.home">Home</span>
      </button>
      <button class="tab" data-route="markets" aria-label="Markets">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M7 16l3-5 3 3 4-7 3 4"/></svg>
        <span data-i18n="nav.markets">Markets</span>
      </button>
      <button class="tab tab-primary" data-route="analysis" aria-label="Analyze">
        <span class="tab-orb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z"/></svg></span>
        <span data-i18n="nav.analysis">Analyze</span>
      </button>
      <button class="tab" data-route="opportunities" aria-label="Signals">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        <span data-i18n="nav.opportunities">Signals</span>
      </button>
      <button class="tab" data-route="history" aria-label="History">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>
        <span data-i18n="nav.history">History</span>
      </button>
    </div>
  </nav>
  <div id="sheet-backdrop" class="sheet-backdrop"></div>
  <aside id="sheet" class="sheet" aria-hidden="true"><div id="sheet-body"></div></aside>
  <div id="toast" class="toast" role="status"></div>
  <script src="static/api.js?v=20261114-premium1"></script>
  <script src="static/i18n.js?v=20261114-premium1"></script>
  <script src="static/charts.js?v=20261114-premium1"></script>
  <script src="static/app.js?v=20261114-premium1"></script>
</body>
</html>
