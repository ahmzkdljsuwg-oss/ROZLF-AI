<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05080b">
  <meta name="color-scheme" content="dark">
  <meta name="rzlf-api-base" content="">
  <title>ROZLF AI — Trading Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mini-app/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="beam beam-a"></span>
    <span class="beam beam-b"></span>
    <span class="grid"></span>
    <span class="grain"></span>
  </div>

  <div class="app-shell">
    <header class="top-dock">
      <div class="brand-lockup">
        <div class="monogram" aria-hidden="true"><span></span><i></i></div>
        <div class="brand-text">
          <strong>ROZLF <em>AI</em></strong>
          <small>THE BOT BY LO AND Q8</small>
        </div>
      </div>
      <div class="dock-actions">
        <button class="signal-pill" id="connection-pill" type="button" aria-live="polite"><i></i><span>CHECKING</span></button>
        <button class="round-btn" id="settings-btn" type="button" aria-label="الإعدادات">⚙</button>
      </div>
    </header>

    <main id="view" class="screen" aria-live="polite">
      <section class="skeleton">
        <div class="sk-block sk-hero"></div>
        <div class="sk-row"><span class="sk-block sk-gem"></span><span class="sk-block sk-gem"></span><span class="sk-block sk-gem"></span></div>
        <div class="sk-block sk-card"></div>
        <div class="sk-block sk-card"></div>
      </section>
    </main>

    <nav class="dock" id="tabbar" aria-label="التنقل">
      <button data-route="home" class="active"><b>⌂</b><small>الرئيسية</small></button>
      <button data-route="markets"><b>◈</b><small>الأسواق</small></button>
      <button data-route="analysis" class="dock-primary"><b>◎</b><small>تحليل</small></button>
      <button data-route="recommendations"><b>✦</b><small>فرص</small></button>
      <button data-route="history"><b>≣</b><small>السجل</small></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </section>
  <div class="toast" id="toast" role="status"></div>

  <script src="/mini-app/static/charts.js"></script>
  <script src="/mini-app/static/api.js"></script>
  <script src="/mini-app/static/app.js"></script>
</body>
</html>
