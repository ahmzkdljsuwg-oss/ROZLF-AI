<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04070a">
  <meta name="color-scheme" content="dark">
  <meta name="rzlf-api-base" content="">
  <title>ROZLF AI — Trading Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mini-app/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="orb orb-emerald"></div>
    <div class="orb orb-gold"></div>
    <div class="grid-lines"></div>
    <div class="noise"></div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="mark-core"></span>
          <span class="mark-ring"></span>
        </div>
        <div class="brand-copy">
          <strong>ROZLF <em>AI</em></strong>
          <small>THE BOT BY LO AND Q8</small>
        </div>
      </div>
      <div class="top-actions">
        <button class="status-pill" id="connection-pill" type="button" aria-live="polite">
          <i></i><span>CHECKING</span>
        </button>
        <button class="icon-btn" id="settings-btn" type="button" aria-label="الإعدادات">⚙</button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite">
      <section class="skeleton">
        <div class="sk-hero"></div>
        <div class="sk-line w40"></div>
        <div class="sk-card"></div>
        <div class="sk-card"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="التنقل">
      <button data-route="home" class="active"><span class="tab-ico">⌂</span><small>الرئيسية</small></button>
      <button data-route="markets"><span class="tab-ico">◈</span><small>الأسواق</small></button>
      <button data-route="analysis" class="primary-tab"><span class="tab-ico">◎</span><small>تحليل</small></button>
      <button data-route="recommendations"><span class="tab-ico">✦</span><small>فرص</small></button>
      <button data-route="history"><span class="tab-ico">≣</span><small>السجل</small></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </section>
  <div class="toast" id="toast" role="status"></div>
  <div class="loading" id="loading" role="status">
    <div class="loader"><span></span><span></span><span></span></div>
    <span id="loading-text">جارٍ الاتصال بالمحرك…</span>
  </div>

  <script src="/mini-app/static/charts.js"></script>
  <script src="/mini-app/static/api.js"></script>
  <script src="/mini-app/static/app.js"></script>
</body>
</html>
