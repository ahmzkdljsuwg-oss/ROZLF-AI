<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050807">
  <title>ROZLF AI</title>
  <link rel="stylesheet" href="/mini-app/static/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span></div>
        <div class="brand-copy">
          <strong>ROZLF <em>AI</em></strong>
          <small>THE BOT BY LO AND Q8</small>
        </div>
      </div>
      <button class="status-pill" id="connection-pill" type="button" data-route="status">
        <i></i><span>CHECKING</span>
      </button>
    </header>

    <main id="view" class="view">
      <section class="skeleton">
        <div class="sk-line w40"></div>
        <div class="sk-card"></div>
        <div class="sk-card"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button data-route="home" class="active"><span>⌂</span><small>الرئيسية</small></button>
      <button data-route="markets"><span>◈</span><small>الأسواق</small></button>
      <button data-route="analysis" class="primary-tab"><span>◎</span><small>تحليل</small></button>
      <button data-route="recommendations"><span>✦</span><small>فرص</small></button>
      <button data-route="history"><span>≣</span><small>السجل</small></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </section>
  <div class="toast" id="toast"></div>
  <div class="loading" id="loading"><div class="loader"></div><span id="loading-text">جارٍ الاتصال بالمحرك…</span></div>

  <script src="/mini-app/static/charts.js"></script>
  <script src="/mini-app/static/api.js"></script>
  <script src="/mini-app/static/app.js"></script>
</body>
</html>
