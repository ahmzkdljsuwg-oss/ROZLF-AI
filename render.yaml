services:
  - type: web
    name: rozlf-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m rozlf
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: MISTRAL_VISION_MODEL
        value: pixtral-12b-2409
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: EO_BRIDGE_URL
        sync: false
      - key: EO_BRIDGE_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/rozlf.db
      - key: LOG_LEVEL
        value: INFO
